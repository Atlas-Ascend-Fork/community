name: multimodal-ai
description: 面向多模态模型关键计算链路的 CANN 社区 SIG，以多模态算子为核心，开展模型计算图拆解、算子抽象与优化，基于新算子重构典型多模态模型 Sample，并对多模态算子及重构后模型进行统一评测，形成从模型需求、算子建设到模型重构与评测验证的协同闭环。
mailing_list: multimodal-ai@cann.osinfra.cn
meeting_whiteboard_url: https://etherpad-cann.meeting.osinfra.cn/p/sig-multimodal-ai

